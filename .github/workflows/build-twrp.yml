name: Build TWRP

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: "minimal-manifest-twrp branch"
        required: false
        default: "twrp-11"
      build_type:
        description: "Build variant"
        required: false
        default: "eng"
        type: choice
        options:
          - eng
          - userdebug
      enable_ssh:
        description: "Open SSH session"
        required: false
        default: false
        type: boolean
      create_release:
        description: "Create GitHub Release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag"
        required: false
        default: ""
        type: string

env:
  TWRP_MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  DEVICE_PATH: device/samsung/goyawifi
  BUILD_DIR: /tmp/twrp-build

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /opt/hostedtoolcache/CodeQL &
          sudo rm -rf /opt/ghc /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium &
          wait
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python-is-python3 \
            python3 \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo tool
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ github.event.inputs.twrp_branch || 'twrp-11' }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.event.inputs.twrp_branch || 'twrp-11' }}-

      - name: Initialize & sync stripped TWRP minimal manifest
        run: |
          BRANCH="${{ github.event.inputs.twrp_branch || 'twrp-11' }}"
          mkdir -p "${{ env.BUILD_DIR }}"
          cd "${{ env.BUILD_DIR }}"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

          repo init -q --depth=1 -u "${{ env.TWRP_MANIFEST_URL }}" -b "${BRANCH}"
          repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j"$(nproc --all)"

          # Strip .repo and unused darwin prebuilts to maximize free disk space
          rm -rf .repo
          rm -rf prebuilts/clang/host/darwin-x86 prebuilts/gcc/darwin-x86
          df -h

      - name: Copy device tree into TWRP source
        run: |
          mkdir -p "${{ env.BUILD_DIR }}/${{ env.DEVICE_PATH }}"
          rsync -a --exclude='.git' --exclude='.github' \
            "${GITHUB_WORKSPACE}/device_tree/" \
            "${{ env.BUILD_DIR }}/${{ env.DEVICE_PATH }}/"

      - name: Build TWRP recovery image
        run: |
          cd "${{ env.BUILD_DIR }}"
          VARIANT="${{ github.event.inputs.build_type || 'eng' }}"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/tmp/ccache
          ccache -M 8G
          ccache -o compression=true
          ccache -z

          set +u
          source build/envsetup.sh
          lunch "twrp_goyawifi-${VARIANT}"
          mka recoveryimage -j"$(nproc --all)"
          ccache -s

      - name: Setup SSH session
        if: ${{ failure() || inputs.enable_ssh }}
        uses: owenthereal/action-upterm@v2
        timeout-minutes: 60
        with:
          full-access: true
          limit-access-to-actor: true
          wait-timeout-minutes: 10

      - name: Package artifacts
        run: |
          OUT_DIR="${{ env.BUILD_DIR }}/out/target/product/goyawifi"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cp "${OUT_DIR}/recovery.img" "${GITHUB_WORKSPACE}/artifacts/twrp-goyawifi.img"
          tar -H ustar -C "${OUT_DIR}" -cf "${GITHUB_WORKSPACE}/artifacts/twrp-goyawifi.tar" recovery.img
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: Upload TWRP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-goyawifi
          path: artifacts/
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT_DIR="${{ env.BUILD_DIR }}/out/target/product/goyawifi"
          PROP_FILE="${OUT_DIR}/recovery/root/prop.default"
          BUILD_DATE=$(grep -m1 '^ro\.build\.date=' "$PROP_FILE" 2>/dev/null | cut -d= -f2- || true)
          [ -n "$BUILD_DATE" ] || BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          FINGERPRINT=$(grep -m1 -E '^ro\.(system\.)?build\.fingerprint=' "$PROP_FILE" 2>/dev/null | cut -d= -f2- || true)
          [ -n "$FINGERPRINT" ] || FINGERPRINT=$(grep -m1 -E '^ro\.(system\.)?build\.fingerprint=' "${OUT_DIR}/system/build.prop" 2>/dev/null | cut -d= -f2- || true)

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="twrp-goyawifi-${{ github.run_number }}"
          fi
          BRANCH="${{ github.event.inputs.twrp_branch || 'twrp-11' }}"
          gh release create "$TAG" \
            artifacts/twrp-goyawifi.img \
            artifacts/twrp-goyawifi.tar \
            --title "TWRP for SM-T110 (goyawifi) - ${BUILD_DATE}" \
            --notes "$(printf 'Manifest branch: `%s`\nDevice tree commit: `%s`\nFingerprint: `%s`' "$BRANCH" "${{ github.sha }}" "${FINGERPRINT:-unknown}")"
